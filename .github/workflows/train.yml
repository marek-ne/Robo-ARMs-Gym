name: train

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  resolve:
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/train'))
      || (github.event_name == 'pull_request_target' && github.event.label.name == 'train-on-node')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      pr: ${{ steps.meta.outputs.pr }}
      actor: ${{ steps.meta.outputs.actor }}
      same_repo: ${{ steps.meta.outputs.same_repo }}
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - id: meta
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const assoc = context.payload.comment.author_association;
              const commenter = context.payload.comment.user.login;
              const author = context.payload.issue.user.login;
              const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc) || commenter === author;
              if (!trusted) {
                core.setFailed('Only the pull request author or a collaborator can spend a GPU job.');
                return;
              }
              const number = context.payload.issue.number;
              const { data } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: number,
              });
              core.setOutput('sha', data.head.sha);
              core.setOutput('pr', String(number));
              core.setOutput('actor', commenter);
              core.setOutput('branch', data.head.ref);
              const full = `${context.repo.owner}/${context.repo.repo}`;
              core.setOutput('same_repo', data.head.repo.full_name === full ? 'true' : 'false');
              return;
            }
            const pull = context.payload.pull_request;
            core.setOutput('sha', pull.head.sha);
            core.setOutput('pr', String(pull.number));
            core.setOutput('actor', context.actor);
            core.setOutput('branch', pull.head.ref);
            const full = `${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('same_repo', pull.head.repo.full_name === full ? 'true' : 'false');

  guard:
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      skill: ${{ steps.review.outputs.skill }}
      gym: ${{ steps.review.outputs.gym }}
      mode: ${{ steps.review.outputs.mode }}
      model: ${{ steps.review.outputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Fetch pull request
        run: git fetch --no-tags origin ${{ needs.resolve.outputs.sha }}
      - id: review
        run: |
          set -euo pipefail
          python -m governance.guard \
            --base "origin/${{ github.event.repository.default_branch }}" \
            --head "${{ needs.resolve.outputs.sha }}" > decision.json
          python - <<'PY'
          import json, os
          decision = json.load(open("decision.json", encoding="utf-8"))
          if not decision.get("ok"):
              raise SystemExit(decision.get("reason", "refused"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skill={decision['skill']}\n")
              handle.write(f"gym={decision['gym']}\n")
              handle.write(f"mode={decision['mode']}\n")
              handle.write(f"model={decision.get('model') or ''}\n")
          PY

  quota:
    needs: [resolve, guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: One job per user per week
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/workflows/train.yml/runs?per_page=50" > runs.json
          python -m governance.quota --actor "${{ needs.resolve.outputs.actor }}" --runs runs.json

  snyk:
    needs: [resolve, guard, quota]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snyk
        run: npm install -g snyk
      - name: Require Snyk token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN is not set. Add it under GitHub Actions secrets."
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Snyk Open Source
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements.txt --severity-threshold=high
      - name: Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high
      - name: Receipt
        env:
          PR_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          python - <<'PY'
          import json, os
          json.dump(
              {"status": "passed", "project": "robo-arm-gym", "commit": os.environ["PR_SHA"]},
              open("snyk.json", "w"),
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: snyk-receipt
          path: snyk.json

  train:
    needs: [resolve, guard, snyk]
    runs-on: [self-hosted, robo-arm]
    timeout-minutes: 120
    steps:
      - name: Trusted gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: snyk-receipt
          path: receipt
      - name: Admit through LiteLLM
        working-directory: trusted
        env:
          AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_KEY }}
          AI_GATEWAY_BASE_URL: ${{ secrets.AI_GATEWAY_BASE_URL }}
          ROBOARM_GPU_MODEL: robo-arm-gpu-probe
        run: python -m governance.admit --receipt "$RUNNER_TEMP/gateway.json"
      - name: Train or eval without gateway credentials
        env:
          MODE: ${{ needs.guard.outputs.mode }}
          GYM: ${{ needs.guard.outputs.gym }}
          SKILL: ${{ needs.guard.outputs.skill }}
          MODEL: ${{ needs.guard.outputs.model }}
        run: |
          chmod +x trusted/governance/run_job.sh
          trusted/governance/run_job.sh \
            "$PWD/trusted" "$PWD/pr" "$MODE" "$GYM" "$SKILL" "$MODEL" \
            "$PWD/receipt/snyk.json" "$RUNNER_TEMP/gateway.json" "$PWD/certificate.json"
      - name: Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f certificate.md ]; then
            echo "The train job stopped before it could write a certificate." > certificate.md
          fi
          gh pr comment "${{ needs.resolve.outputs.pr }}" --body-file certificate.md
      - name: Push the certified manifest
        if: needs.resolve.outputs.same_repo == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKILL: ${{ needs.guard.outputs.skill }}
        run: |
          set -euo pipefail
          passed=$(python -c 'import json; print(json.load(open("certificate.json"))["passed"])')
          if [ "$passed" != "True" ]; then
            exit 0
          fi
          cd pr
          git config user.email "robo-arm-gym@users.noreply.github.com"
          git config user.name "robo-arm-gym"
          git add "skills/${SKILL}/skill.yaml"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Certify ${SKILL}"
          gh auth setup-git
          git push origin "HEAD:${{ needs.resolve.outputs.branch }}"
      - name: Gate
        run: python -c 'import json,sys; sys.exit(0 if json.load(open("certificate.json"))["passed"] else 1)'
