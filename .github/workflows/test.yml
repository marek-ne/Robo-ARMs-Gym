name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for MuJoCo
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install
        run: python -m pip install -e .
      - name: Portable tests
        env:
          MUJOCO_GL: egl
        run: >
          python -m unittest
          tests.test_governance
          tests.test_skills_registry
          tests.test_twin
          tests.test_twin_gym
          tests.test_place_twin
          tests.test_barrier_twin
