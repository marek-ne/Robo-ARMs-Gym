name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for MuJoCo
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri libglib2.0-0
      - name: Install
        run: python -m pip install -e .
      - name: Gate tests
        run: python -m unittest tests.test_governance tests.test_skills_registry
      - name: Gym tests
        env:
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
        run: python -m unittest tests.test_twin tests.test_twin_gym tests.test_place_twin tests.test_barrier_twin
